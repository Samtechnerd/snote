<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNote</title>
<style>
  /* Design tokens: the same values as the app's Colour mode (light and dark). */
  :root {
    --bg: #F2F2F7; --bar: #E3E3E8; --surface: #FFFFFF; --text: #000000; --muted: #8E8E93;
    --accent: #007AFF; --on-accent: #FFFFFF; --sel-bg: #DCEBFF; --sel-text: #007AFF;
    --outline: #D1D1D6; --ow: 0.8px; --danger: #FF3B30;
    --shadow: 0 2px 8px rgba(0,0,0,.10), 0 0 1px rgba(0,0,0,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000; --bar: #1C1C1E; --surface: #1C1C1E; --text: #FFFFFF; --muted: #8E8E93;
      --accent: #0A84FF; --sel-bg: #12304F; --sel-text: #0A84FF; --outline: #38383A; --danger: #FF453A;
      --shadow: 0 2px 10px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000; --bar: #1C1C1E; --surface: #1C1C1E; --text: #FFFFFF; --muted: #8E8E93;
    --accent: #0A84FF; --sel-bg: #12304F; --sel-text: #0A84FF; --outline: #38383A; --danger: #FF453A;
    --shadow: 0 2px 10px rgba(0,0,0,.55);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { font: 16px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:disabled { cursor: default; }
  .hidden { display: none !important; }
  .muted { color: var(--muted); }

  /* shared pieces: NbButton, NbSegmented, NbSectionLabel, surfaces */
  .surface { background: var(--surface); border: var(--ow) solid var(--outline); box-shadow: var(--shadow); }
  .btn { min-height: 44px; padding: 0 20px; border-radius: 50px; font-weight: 600; color: var(--accent); display: inline-flex; align-items: center; justify-content: center; }
  .btn.filled { background: var(--accent); color: var(--on-accent); }
  .btn.outlined { border: 1px solid var(--accent); }
  .btn.danger { color: var(--danger); }
  .label { font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--muted); margin: 10px 0 4px; letter-spacing: .02em; }
  .seg { display: flex; gap: 2px; padding: 2px; border-radius: 10px; background: var(--bg); border: var(--ow) solid var(--outline); }
  .seg button { flex: 1; min-height: 40px; border-radius: 8px; font-size: 14px; font-weight: 600; }
  .seg button.sel { background: var(--sel-bg); color: var(--sel-text); }
  .field { width: 100%; min-height: 44px; padding: 0 12px; border-radius: 10px; border: var(--ow) solid var(--outline); background: var(--surface); color: var(--text); font: inherit; font-size: 16px; }
  .field::placeholder { color: var(--muted); }
  .chip { min-height: 36px; padding: 0 14px; border-radius: 50px; border: var(--ow) solid var(--outline); background: var(--surface); font-size: 15px; font-weight: 600; }
  .chip.sel { background: var(--sel-bg); color: var(--sel-text); }
  .err { color: var(--danger); font-size: 14px; min-height: 1.2em; }

  /* sign-in */
  #login { height: 100%; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .card { width: 100%; max-width: 400px; border-radius: 20px; padding: 24px; display: grid; gap: 12px; }
  .brand { font-size: 34px; font-weight: 700; margin: 0; letter-spacing: -.5px; }
  .brand i { font-style: normal; color: var(--accent); }

  /* app frame */
  #app { height: 100%; display: flex; flex-direction: column; }
  #demoBanner { background: #FF9500; color: #000; text-align: center; font-size: 13px; padding: 4px 8px; }
  #content { flex: 1; min-height: 0; position: relative; }

  /* tab bar: Chrome-style, Start first, the active tab joins the page below */
  #tabbar { height: 44px; background: var(--bar); border-bottom: var(--ow) solid var(--outline); display: flex; align-items: flex-end; padding: 0 8px; overflow-x: auto; overflow-y: hidden; flex: none; scrollbar-width: none; }
  #tabbar::-webkit-scrollbar { display: none; }
  .tab { height: 38px; width: 160px; flex: none; display: flex; align-items: center; padding-left: 12px; border-radius: 10px 10px 0 0; font-size: 13px; font-weight: 500; cursor: pointer; position: relative; }
  .tab.start { width: 96px; }
  .tab.sel { background: var(--bg); font-weight: 600; margin-bottom: calc(var(--ow) * -1); height: 39px; }
  .tab .ti { width: 16px; height: 16px; border-radius: 3px; flex: none; margin-right: 8px; }
  .tab .tt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab .x { width: 34px; height: 100%; font-size: 18px; font-weight: 700; color: var(--muted); display: flex; align-items: center; justify-content: center; }
  .tabsep { width: var(--ow); height: 16px; background: var(--outline); margin: 0 0 11px; flex: none; }
  #newTab { width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; margin-left: 6px; }
  #newTab span { width: 30px; height: 30px; border-radius: 50%; border: var(--ow) solid var(--outline); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; }

  /* Start page */
  #start { height: 100%; display: flex; }
  #folders { width: 160px; flex: none; padding: 12px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
  #folders h2 { margin: 0 0 8px 12px; font-size: 20px; font-weight: 700; }
  .sbitem { min-height: 44px; padding: 0 12px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; font-weight: 500; text-align: left; width: 100%; }
  .sbitem.sel { background: var(--sel-bg); color: var(--sel-text); }
  .sbitem .n { font-size: 14px; color: var(--muted); } .sbitem.sel .n { color: var(--sel-text); }
  #folderSpacer { flex: 1; }
  #startMain { flex: 1; min-width: 0; padding: 16px 24px 0 8px; display: flex; flex-direction: column; }
  #startHead { display: flex; align-items: center; gap: 12px; }
  #startHead .t { flex: 1; min-width: 0; }
  #startHead h1 { margin: 0; font-size: 28px; font-weight: 700; }
  #search { width: 200px; }
  #grid { margin-top: 16px; flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px 14px; align-content: start; padding-bottom: 24px; }
  .nbitem { width: 96px; }
  .cover { width: 96px; height: 118px; border-radius: 10px; position: relative; overflow: hidden; cursor: pointer; border: var(--ow) solid var(--outline); box-shadow: var(--shadow); }
  .cover .ct { position: absolute; left: 6px; right: 6px; bottom: 6px; text-align: center; color: #fff; font-size: 13px; font-weight: 600; padding: 3px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nbitem .sub { margin-top: 4px; font-size: 12px; color: var(--muted); }
  .nbitem .del { min-height: 44px; padding-top: 4px; font-size: 12px; font-weight: 600; color: var(--accent); display: block; }
  .tile { width: 96px; height: 118px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 700; color: var(--accent); }
  .tilelabel { margin-top: 4px; font-size: 12px; font-weight: 600; }
  #startStatus { font-size: 14px; color: var(--muted); min-height: 20px; margin-top: 4px; }
  .acct { font-size: 13px; }
  .acct .em { font-weight: 600; overflow-wrap: anywhere; }
  .acct .btn { min-height: 40px; padding: 0 14px; margin-top: 6px; width: 100%; }
  @media (max-width: 599px) {
    #start { flex-direction: column; }
    #folders { width: auto; flex-direction: row; flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; padding: 12px 16px 0; align-items: center; }
    #folders h2, #folders .acct, #folders .label, #folders .seg { display: none; }
    .sbitem { width: auto; border-radius: 50px; border: var(--ow) solid var(--outline); background: var(--surface); flex: none; gap: 8px; min-height: 36px; }
    #folderSpacer { display: none; }
    #startMain { padding: 12px 16px 0; }
    #startHead { flex-wrap: wrap; } #search { width: 100%; }
    #compactBottom { display: block !important; }
  }
  #compactBottom { display: none; padding: 8px 16px 12px; border-top: var(--ow) solid var(--outline); }

  /* notebook screen: page in the middle, floating round menu button, tool rail, page pill */
  #nbscreen { position: absolute; inset: 0; background: var(--bg); }
  #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px 76px 16px 16px; }
  #wrap { position: relative; line-height: 0; }
  canvas { background: #fff; display: block; border: 1.5px solid var(--outline); box-shadow: var(--shadow); }
  #boxEd { position: absolute; background: #fff; color: #000; border: 1.5px dashed var(--accent); border-radius: 2px; resize: none; overflow: hidden; line-height: 1.2; font-family: Roboto, system-ui, "Segoe UI", sans-serif; outline: none; }
  .fab { position: absolute; z-index: 4; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; }
  #menuFab { top: 12px; left: 12px; }
  #menuFab i, #menuFab i::before, #menuFab i::after { display: block; width: 18px; height: 2px; background: var(--text); border-radius: 1px; position: relative; content: ""; }
  #menuFab i::before { position: absolute; top: -6px; } #menuFab i::after { position: absolute; top: 6px; }
  #rail { position: absolute; z-index: 3; display: flex; align-items: center; gap: 2px; background: var(--surface); border: var(--ow) solid var(--outline); box-shadow: var(--shadow); }
  .tb { width: 44px; height: 44px; border-radius: 10px; font-size: 11px; font-weight: 600; flex: none; }
  .tb.sel { background: var(--sel-bg); color: var(--sel-text); }
  .tb:disabled { color: rgba(142,142,147,.5); }
  .tb.red { color: var(--danger); }
  .sep { background: var(--outline); flex: none; }
  .sw { width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
  .sw i { width: 22px; height: 22px; border-radius: 50%; border: var(--ow) solid var(--outline); display: block; }
  .sw.sel { box-shadow: inset 0 0 0 2px var(--accent); }
  /* portrait / narrow: the tools lie along the top */
  #rail { top: 12px; left: 50%; transform: translateX(-50%); flex-direction: row; height: 46px; border-radius: 23px; padding: 0 8px; max-width: calc(100% - 140px); overflow-x: auto; scrollbar-width: none; }
  #rail .sep { width: var(--ow); height: 26px; margin: 0 6px; }
  #stage { padding: 70px 16px 70px; }
  /* landscape: a vertical rail on the right */
  @media (orientation: landscape) and (min-width: 700px) {
    #rail { top: 50%; right: 12px; left: auto; transform: translateY(-50%); flex-direction: column; width: 60px; height: auto; border-radius: 20px; padding: 8px 0; max-width: none; max-height: calc(100% - 24px); overflow-y: auto; overflow-x: hidden; align-items: center; }
    #rail .sep { width: 36px; height: var(--ow); margin: 6px 0; }
    #stage { padding: 16px 84px 16px 70px; }
  }
  #bottom { position: absolute; z-index: 3; bottom: 12px; left: 0; right: 0; display: flex; justify-content: center; gap: 8px; pointer-events: none; }
  #bottom > * { pointer-events: auto; }
  #pill { height: 44px; border-radius: 22px; display: flex; align-items: center; padding: 0 4px; }
  #pill button { width: 40px; height: 40px; font-size: 22px; border-radius: 50%; }
  #pill button:disabled { color: rgba(142,142,147,.5); }
  #pageNo { font-weight: 600; font-size: 15px; padding: 0 8px; min-width: 110px; text-align: center; }
  #plusFab { position: static; }
  .menu { position: absolute; z-index: 6; bottom: 64px; border-radius: 14px; padding: 6px; min-width: 190px; }
  .menu button { display: block; width: 100%; min-height: 44px; padding: 0 12px; text-align: left; border-radius: 10px; font-weight: 500; }
  .menu button:hover { background: var(--bg); }
  #plusMenu { left: 50%; transform: translateX(40px); }
  #nbPanelWrap { position: absolute; inset: 0; z-index: 7; }
  #nbPanel { position: absolute; top: 12px; bottom: 12px; left: 12px; width: 260px; max-width: calc(100% - 24px); border-radius: 20px; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  #nbPanel h1 { margin: 0; font-size: 22px; font-weight: 700; }
  #nbPanel .btn { width: 100%; }
  #saveState { position: absolute; left: 16px; bottom: 16px; font-size: 12px; color: var(--muted); z-index: 2; }
  #msg { position: absolute; left: 50%; bottom: 66px; transform: translateX(-50%); z-index: 5; font-size: 13px; max-width: 90%; text-align: center; padding: 6px 12px; border-radius: 12px; background: var(--surface); border: var(--ow) solid var(--outline); box-shadow: var(--shadow); }
  #msg.bad { color: var(--danger); }
  #empty { color: var(--muted); text-align: center; padding: 24px; }

  /* sheets (New Notebook, New Folder) */
  .scrim { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; padding: 12px; }
  .sheet { width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto; border-radius: 20px; padding: 16px; display: grid; gap: 12px; }
  .sheethead { display: flex; align-items: center; justify-content: space-between; }
  .sheethead b { font-size: 17px; }
  .sheethead button { min-height: 44px; padding: 0 8px; font-weight: 600; color: var(--accent); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .paper { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; width: 76px; }
  .paper canvas { width: 76px; height: 104px; border-radius: 8px; border: var(--ow) solid var(--outline); box-shadow: none; }
  .paper.sel canvas { border: 3px solid var(--accent); } .paper.sel { color: var(--sel-text); }
  .cc { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .cc i { width: 34px; height: 34px; border-radius: 50%; display: block; }
  .cc.sel { box-shadow: inset 0 0 0 2px var(--accent); } .cc.sel i { border: 3px solid var(--surface); }
</style>
</head>
<body>

<div id="login">
  <form class="card surface" id="loginForm">
    <h1 class="brand">S<i>Note</i></h1>
    <div class="muted" style="font-size:14px">Sign in with the account you use in the SNote app to see and edit your notebooks here.</div>
    <input class="field" id="email" type="email" placeholder="Email" autocomplete="username" required>
    <input class="field" id="password" type="password" placeholder="Password" autocomplete="current-password" required>
    <label class="muted" style="font-size:13px"><input id="stay" type="checkbox" checked style="margin-right:6px">Stay signed in on this browser</label>
    <div class="err" id="loginErr"></div>
    <button class="btn filled" type="submit" id="signInBtn">Sign in</button>
    <div class="row"><button type="button" class="btn" id="resetBtn" style="flex:1">Forgot password</button><button type="button" class="btn" id="demoBtn" style="flex:1">Try the demo</button></div>
  </form>
</div>

<div id="app" class="hidden">
  <div id="demoBanner" class="hidden">Demo mode: sample notebooks, nothing is saved anywhere. Reload to reset.</div>
  <div id="tabbar"></div>
  <div id="content">
    <div id="start">
      <aside id="folders"></aside>
      <div id="startMain">
        <div id="startHead"><div class="t"><h1 id="startTitle">All Notebooks</h1><div class="muted" style="font-size:14px" id="startCount"></div></div><input class="field" id="search" placeholder="Search"></div>
        <div id="startStatus"></div>
        <div id="grid"></div>
        <div id="compactBottom"></div>
      </div>
    </div>
    <div id="nbscreen" class="hidden">
      <div id="stage"></div>
      <button class="fab surface" id="menuFab" title="Menu"><i></i></button>
      <div id="rail">
        <button class="tb" data-tool="pen">Pen</button><button class="tb" data-tool="marker">Marker</button>
        <button class="tb" data-tool="eraser">Erase</button><button class="tb" data-tool="text">Text</button>
        <span class="sep"></span>
        <button class="tb" id="undo">Undo</button><button class="tb" id="redo">Redo</button>
        <span class="sep"></span>
        <button class="sw" data-col="0" title="Black"><i style="background:#000"></i></button>
        <button class="sw" data-col="1" title="Blue"><i style="background:#007AFF"></i></button>
        <button class="sw" data-col="2" title="Red"><i style="background:#FF3B30"></i></button>
        <button class="tb red hidden" id="delBox">Del box</button>
      </div>
      <div id="bottom">
        <div id="pill" class="surface"><button id="prev">&lsaquo;</button><span id="pageNo"></span><button id="next">&rsaquo;</button></div>
        <button class="fab surface" id="plusFab" title="Pages">+</button>
      </div>
      <div id="plusMenu" class="menu surface hidden"><button id="addPage">Add page</button><button id="delPage" class="danger" style="color:var(--danger)">Delete this page</button></div>
      <div id="saveState"></div>
      <div id="msg" class="hidden"></div>
      <div id="nbPanelWrap" class="hidden">
        <div id="nbPanel" class="surface">
          <h1>SNote</h1>
          <div class="label">Appearance</div>
          <div class="seg" id="themeSeg2"><button data-th="light">Light</button><button data-th="dark">Dark</button></div>
          <div class="label">Page</div>
          <button class="btn outlined" id="png">Save page as image</button>
          <button class="btn" id="closePanel">Close</button>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="sheetHost"></div>

<script>
"use strict";
// ---- Firebase project (from the app's google-services.json). The web API key is public by design; the security rules protect the data.
const API_KEY = "AIzaSyCOYKxOOicc3gD8AGUUn0Vi0n4IGGXQKvg";
const PROJECT = "snote-d51ea";
const FS = `https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents`;

const PW = 595, PH = 842;                    // A4 page units, same as the app
const $ = id => document.getElementById(id);
const COVERS = ["#007AFF", "#34C759", "#FF9500", "#AF52DE", "#FF3B30", "#30B0C7"];   // the app's cover colours
const uuid = () => (crypto && crypto.randomUUID) ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === "x" ? r : (r & 3 | 8)).toString(16); });
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };

// ------------------------------------------------------------------ appearance (Light / Dark, like the app)
function applyTheme(t) {
  if (t === "light" || t === "dark") { document.documentElement.dataset.theme = t; store.set("snote_theme", t); }
  document.querySelectorAll("[data-th]").forEach(b => b.classList.toggle("sel", b.dataset.th === currentTheme()));
}
function currentTheme() { return document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); }
{ const t = store.get("snote_theme"); if (t) document.documentElement.dataset.theme = t; }

// ------------------------------------------------------------------ auth (Firebase Auth REST)
let session = null;   // { idToken, refreshToken, uid, email, expires }
let demo = false;

async function authCall(endpoint, body) {
  const r = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:${endpoint}?key=${API_KEY}`, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  const j = await r.json();
  if (!r.ok) throw new Error(friendly(j.error && j.error.message));
  return j;
}
function friendly(code) {
  code = String(code || "");
  if (code.startsWith("INVALID_PASSWORD") || code.startsWith("INVALID_LOGIN_CREDENTIALS") || code.startsWith("EMAIL_NOT_FOUND")) return "Wrong email or password.";
  if (code.startsWith("INVALID_EMAIL")) return "That email address doesn't look right.";
  if (code.startsWith("TOO_MANY_ATTEMPTS")) return "Too many attempts. Wait a moment and try again.";
  if (code.startsWith("OPERATION_NOT_ALLOWED")) return "Email sign-in is not switched on in the Firebase project.";
  if (code.startsWith("API_KEY") || code.includes("referer") || code.includes("blocked")) return "This site is blocked by the API key's restrictions. " + code;
  return code || "Something went wrong.";
}
function setSession(j) {
  session = { idToken: j.idToken || j.id_token, refreshToken: j.refreshToken || j.refresh_token, uid: j.localId || j.user_id, email: j.email || (session && session.email),
              expires: Date.now() + (parseInt(j.expiresIn || j.expires_in || "3600", 10) - 60) * 1000 };
}
async function refreshIfNeeded() {
  if (!session || Date.now() < session.expires) return;
  const r = await fetch(`https://securetoken.googleapis.com/v1/token?key=${API_KEY}`, {
    method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: `grant_type=refresh_token&refresh_token=${encodeURIComponent(session.refreshToken)}`,
  });
  const j = await r.json();
  if (!r.ok) throw new Error("Session expired. Please sign in again.");
  const email = session.email; setSession(j); session.email = email; remember();
}
function remember() { if ($("stay").checked && session && !demo) store.set("snote_session", JSON.stringify({ r: session.refreshToken, e: session.email })); }
function forget() { store.del("snote_session"); }

// ------------------------------------------------------------------ data layer: the real cloud (Firestore REST) or the in-memory demo
function val(v) {
  if (!v) return null;
  if ("stringValue" in v) return v.stringValue;
  if ("integerValue" in v) return Number(v.integerValue);
  if ("doubleValue" in v) return v.doubleValue;
  if ("booleanValue" in v) return v.booleanValue;
  if ("bytesValue" in v) return v.bytesValue;     // base64
  return null;
}
function fromDoc(doc) {
  const o = { _id: doc.name.split("/").pop() };
  for (const k in (doc.fields || {})) o[k] = val(doc.fields[k]);
  return o;
}
function toFields(obj) {
  const f = {};
  for (const k in obj) {
    if (k.startsWith("_")) continue;
    const v = obj[k];
    if (v === null || v === undefined) f[k] = { nullValue: null };
    else if (typeof v === "string") f[k] = k === "strokes" ? { bytesValue: v } : { stringValue: v };
    else if (typeof v === "boolean") f[k] = { booleanValue: v };
    else if (typeof v === "number") f[k] = Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };

  catch (err) { $("loginErr").textContent = err.message; }

function seedDemo() {
  const now = Date.now();
  const spiral = { tool: "PEN", color: INK_COLORS[1], width: 3, n: 0, pts: [] };
  for (let i = 0; i < 90; i++) { const a = i / 8, r = 6 + i * 1.4; spiral.pts.push(420 + Math.cos(a) * r, 520 + Math.sin(a) * r, 0.5 + 0.4 * Math.sin(i / 9), i * 12); spiral.n++; }
  spiral.pts = Float32Array.from(spiral.pts);
  const under = { tool: "MARKER", color: INK_COLORS[2], width: 12, n: 2, pts: Float32Array.from([70, 138, 0.5, 0, 330, 138, 0.5, 200]) };
  const box = { id: uuid(), x: 60, y: 90, w: 300, h: 80, z: 0, updatedAt: now,
    content: contentJson([
      { style: "heading", align: "left", list: "none", indent: 0, runs: [{ text: "Meeting notes", size: 22, bold: true }] },
      { style: "body", align: "left", list: "bullet", indent: 0, runs: [{ text: "Sync works between the tablet and here", size: 14 }] },
      { style: "body", align: "left", list: "bullet", indent: 0, runs: [{ text: "Draw with the pen, ", size: 14 }, { text: "type with the text tool", size: 14, italic: true }] },
    ], 1.2) };
  demoStore.folders["demo-f1"] = { name: "Work", sortOrder: 0, updatedAt: now };
  demoStore.notebooks["demo-nb1"] = { folderId: "demo-f1", title: "Maths", cover: 0, paperStyle: "GRID", createdAt: now, updatedAt: now, lastOpenedAt: now };
  demoStore.pages["demo-p1"] = { notebookId: "demo-nb1", index: 0, type: "INK", documentId: null, pdfPage: -1, updatedAt: now, boxes: JSON.stringify([box]), strokes: encodeStrokes([spiral, under]) };
  demoStore.pages["demo-p2"] = { notebookId: "demo-nb1", index: 1, type: "INK", documentId: null, pdfPage: -1, updatedAt: now, boxes: "[]", strokes: encodeStrokes([]) };
  demoStore.notebooks["demo-nb2"] = { folderId: null, title: "Typed pages", cover: 1, paperStyle: "BLANK", createdAt: now - 5, updatedAt: now - 5, lastOpenedAt: now - 5 };
  demoStore.documents["demo-d1"] = { notebookId: "demo-nb2", updatedAt: now, content: contentJson([
    { style: "title", align: "left", list: "none", indent: 0, runs: [{ text: "A typed page", size: 26, bold: true }] },
    { style: "body", align: "left", list: "none", indent: 0, runs: [{ text: "Typed pages flow like a document and are edited in the SNote app. This viewer shows them as they are on the tablet, and you can draw over them.", size: 14 }] },
  ], 1.2) };
  demoStore.pages["demo-p3"] = { notebookId: "demo-nb2", index: 0, type: "TYPED", documentId: "demo-d1", pdfPage: -1, updatedAt: now, boxes: "[]", strokes: encodeStrokes([]) };
  demoStore.notebooks["demo-nb3"] = { folderId: "demo-f1", title: "Ruled", cover: 2, paperStyle: "RULED", createdAt: now - 9, updatedAt: now - 9, lastOpenedAt: now - 9 };
  demoStore.pages["demo-p4"] = { notebookId: "demo-nb3", index: 0, type: "INK", documentId: null, pdfPage: -1, updatedAt: now, boxes: "[]", strokes: encodeStrokes([]) };
}
$("demoBtn").onclick = async () => {
  demo = true; backend = mem; session = { email: "demo (nothing is saved)", uid: "demo" };
  Object.keys(demoStore).forEach(k => demoStore[k] = {}); seedDemo(); await enterApp();
};
(async () => {
  applyTheme(null);
  if (location.hash === "#demo") { $("demoBtn").onclick(); return; }
  try {
    const saved = JSON.parse(store.get("snote_session") || "null");
    if (saved && saved.r) {
      session = { refreshToken: saved.r, email: saved.e, expires: 0 };
      await refreshIfNeeded(); session.email = saved.e;
      await enterApp(); return;
    }
  } catch (e) { session = null; forget(); }
  showLogin("");
})();
// pick up changes made on the tablet when coming back to this tab (never while there are unsaved edits)
document.addEventListener("visibilitychange", () => { if (!document.hidden && session && !demo && !dirty.size && !live && !editingBoxId) loadLibrary(); });
</script>
