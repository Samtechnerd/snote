<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNote Web</title>
<style>
  :root {
    --bg: #f2f2f7; --panel: #ffffff; --text: #1c1c1e; --muted: #6e6e73; --line: #d1d1d6;
    --accent: #007aff; --on-accent: #ffffff; --sel: #e5f0ff; --danger: #d70015; --ok: #1a7f37;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000000; --panel: #1c1c1e; --text: #f2f2f7; --muted: #98989f; --line: #38383a;
            --accent: #0a84ff; --sel: #12304f; --danger: #ff453a; --ok: #30d158; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 15px/1.4 -apple-system, "SF Pro Text", Roboto, system-ui, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  button, select { font: inherit; color: var(--accent); background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; cursor: pointer; min-height: 36px; }
  select { color: var(--text); background: var(--panel); }
  button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  button.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .4; cursor: default; }
  input, textarea { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-height: 42px; }
  .hidden { display: none !important; }

  /* sign-in */
  #login { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 24px; width: 100%; max-width: 380px; display: grid; gap: 12px; }
  .card h1 { margin: 0; font-size: 28px; }
  .muted { color: var(--muted); font-size: 13px; }
  .err { color: var(--danger); font-size: 14px; min-height: 1.2em; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row > .grow { flex: 1; }

  /* app */
  #app { height: 100%; display: flex; flex-direction: column; }
  #demoBanner { background: #ff9500; color: #000; text-align: center; font-size: 13px; padding: 4px 8px; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 18px; flex: 1; }
  header .who { color: var(--muted); font-size: 13px; max-width: 40vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  main { flex: 1; min-height: 0; display: flex; }
  aside { width: 280px; background: var(--panel); border-right: 1px solid var(--line); overflow: auto; padding: 8px; }
  aside h2 { margin: 14px 8px 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  #newNb { margin: 6px 8px 4px; width: calc(100% - 16px); }
  .nb { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; cursor: pointer; }
  .nb:hover { background: var(--bg); }
  .nb.sel { background: var(--sel); }
  .nb .sw { width: 14px; height: 18px; border-radius: 3px; border: 1px solid var(--line); flex: none; }
  .nb .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  section { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 8px 16px; flex-wrap: wrap; }
  .bar .title { font-weight: 600; flex: 1; min-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #tools { padding-top: 0; }
  .sw2 { width: 30px; height: 30px; padding: 0; border-radius: 50%; border: 2px solid var(--line); }
  .sw2.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .wd { width: 38px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
  .wd i { display: block; width: 22px; background: currentColor; border-radius: 3px; }
  #stage { flex: 1; min-height: 0; overflow: auto; display: flex; justify-content: center; align-items: flex-start; padding: 8px 16px 24px; }
  #wrap { position: relative; line-height: 0; }
  canvas { background: #fff; box-shadow: 0 1px 12px rgba(0,0,0,.25); border-radius: 2px; max-width: 100%; display: block; }
  #boxEd { position: absolute; background: #fff; color: #000; border: 1.5px dashed var(--accent); border-radius: 2px; padding: 0; resize: none; overflow: hidden; line-height: 1.2; min-height: 0; }
  #empty { margin: auto; color: var(--muted); text-align: center; padding: 24px; }
  #status { color: var(--muted); font-size: 12px; padding: 0 16px 8px; min-height: 20px; }
  #status.bad { color: var(--danger); }
  #menuBtn { display: none; }
  dialog { border: 1px solid var(--line); border-radius: 16px; background: var(--panel); color: var(--text); padding: 20px; width: min(92vw, 380px); }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  dialog form { display: grid; gap: 12px; }
  @media (max-width: 720px) {
    aside { position: fixed; inset: 53px 0 0 0; width: auto; z-index: 5; display: none; }
    aside.open { display: block; }
    #menuBtn { display: inline-block; }
    header .who { display: none; }
  }
</style>
</head>
<body>

<div id="login">
  <form class="card" id="loginForm">
    <h1>SNote</h1>
    <div class="muted">Sign in with the same account you use in the SNote app to see and edit your notebooks here.</div>
    <input id="email" type="email" placeholder="Email" autocomplete="username" required>
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
    <label class="muted"><input id="stay" type="checkbox" checked style="width:auto;min-height:0;margin-right:6px">Stay signed in on this browser</label>
    <div class="err" id="loginErr"></div>
    <button class="primary" type="submit" id="signInBtn">Sign in</button>
    <div class="row"><button type="button" id="resetBtn" class="grow">Forgot password</button><button type="button" id="demoBtn" class="grow">Try the demo</button></div>
  </form>
</div>

<div id="app" class="hidden">
  <div id="demoBanner" class="hidden">Demo mode: sample notebooks, nothing is saved anywhere. Reload to reset.</div>
  <header>
    <button id="menuBtn">Notebooks</button>
    <h1>SNote</h1>
    <span class="who" id="who"></span>
    <button id="refreshBtn">Refresh</button>
    <button id="signOutBtn">Sign out</button>
  </header>
  <main>
    <aside id="side"></aside>
    <section>
      <div id="bar" class="bar hidden">
        <span class="title" id="nbTitle"></span>
        <button id="editBtn">Edit</button>
        <button id="prev">&lsaquo;</button>
        <span id="pageNo" class="muted"></span>
        <button id="next">&rsaquo;</button>
        <button id="addPage">+ Page</button>
        <button id="delPage" class="danger">Delete page</button>
        <button id="png">Save image</button>
        <button id="delNb" class="danger">Delete notebook</button>
      </div>
      <div id="tools" class="bar hidden">
        <button data-tool="pen">Pen</button><button data-tool="marker">Marker</button>
        <button data-tool="eraser">Eraser</button><button data-tool="text">Text</button>
        <span class="muted">|</span>
        <button class="sw2" data-col="0" style="background:#000" title="Black"></button>
        <button class="sw2" data-col="1" style="background:#007AFF" title="Blue"></button>
        <button class="sw2" data-col="2" style="background:#FF3B30" title="Red"></button>
        <span class="muted">|</span>
        <button class="wd" data-wd="0" title="Thin"><i style="height:2px"></i></button>
        <button class="wd" data-wd="1" title="Medium"><i style="height:4px"></i></button>
        <button class="wd" data-wd="2" title="Thick"><i style="height:7px"></i></button>
        <span class="muted">|</span>
        <button id="undo">Undo</button><button id="redo">Redo</button>
        <button id="delBox" class="danger hidden">Delete box</button>
        <span id="saveState" class="muted"></span>
      </div>
      <div id="status"></div>
      <div id="stage"><div id="empty">Choose a notebook on the left.</div></div>
    </section>
  </main>
</div>

<dialog id="nbDialog">
  <form method="dialog" id="nbForm">
    <strong>New notebook</strong>
    <input id="nbName" placeholder="Name" required>
    <select id="nbPaper"><option value="GRID">Grid paper</option><option value="RULED">Ruled paper</option><option value="DOT">Dot paper</option><option value="BLANK">Blank paper</option></select>
    <select id="nbCover"><option value="0">Black cover</option><option value="1">Blue cover</option><option value="2">Red cover</option><option value="3">Green cover</option><option value="4">Orange cover</option><option value="5">Purple cover</option></select>
    <div class="row"><button type="button" id="nbCancel" class="grow">Cancel</button><button class="primary grow" value="ok">Create</button></div>
  </form>
</dialog>

<script>
"use strict";
// ---- Firebase project (from the app's google-services.json). The web API key is public by design; the security rules protect the data.
const API_KEY = "AIzaSyCOYKxOOicc3gD8AGUUn0Vi0n4IGGXQKvg";
const PROJECT = "snote-d51ea";
const FS = `https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents`;

const PW = 595, PH = 842;                    // A4 page units, same as the app
const $ = id => document.getElementById(id);
const COVERS = ["#1c1c1e", "#007aff", "#ff3b30", "#34c759", "#ff9500", "#af52de", "#5ac8fa", "#8e8e93"];
const uuid = () => (crypto && crypto.randomUUID) ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === "x" ? r : (r & 3 | 8)).toString(16); });

// ------------------------------------------------------------------ auth (Firebase Auth REST)
let session = null;   // { idToken, refreshToken, uid, email, expires }
let demo = false;

async function authCall(endpoint, body) {
  const r = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:${endpoint}?key=${API_KEY}`, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  const j = await r.json();
  if (!r.ok) throw new Error(friendly(j.error && j.error.message));
  return j;
}
function friendly(code) {
  code = String(code || "");
  if (code.startsWith("INVALID_PASSWORD") || code.startsWith("INVALID_LOGIN_CREDENTIALS") || code.startsWith("EMAIL_NOT_FOUND")) return "Wrong email or password.";
  if (code.startsWith("INVALID_EMAIL")) return "That email address doesn't look right.";
  if (code.startsWith("TOO_MANY_ATTEMPTS")) return "Too many attempts. Wait a moment and try again.";
  if (code.startsWith("OPERATION_NOT_ALLOWED")) return "Email sign-in is not switched on in the Firebase project.";
  if (code.startsWith("API_KEY") || code.includes("referer") || code.includes("blocked")) return "This site is blocked by the API key's restrictions. " + code;
  return code || "Something went wrong.";
}
function setSession(j) {
  session = { idToken: j.idToken || j.id_token, refreshToken: j.refreshToken || j.refresh_token, uid: j.localId || j.user_id, email: j.email || (session && session.email),
              expires: Date.now() + (parseInt(j.expiresIn || j.expires_in || "3600", 10) - 60) * 1000 };
}
async function refreshIfNeeded() {
  if (!session || Date.now() < session.expires) return;
  const r = await fetch(`https://securetoken.googleapis.com/v1/token?key=${API_KEY}`, {
    method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: `grant_type=refresh_token&refresh_token=${encodeURIComponent(session.refreshToken)}`,
  });
  const j = await r.json();
  if (!r.ok) throw new Error("Session expired. Please sign in again.");
  const email = session.email; setSession(j); session.email = email; remember();
}
function remember() {
  try { if ($("stay").checked && session && !demo) localStorage.setItem("snote_session", JSON.stringify({ r: session.refreshToken, e: session.email })); } catch (e) {}
}
function forget() { try { localStorage.removeItem("snote_session"); } catch (e) {} }

// ------------------------------------------------------------------ data layer: the real cloud (Firestore REST) or the in-memory demo
// Documents are plain objects here; bytes are base64 strings in the `strokes` field.
function val(v) {
  if (!v) return null;
  if ("stringValue" in v) return v.stringValue;
  if ("integerValue" in v) return Number(v.integerValue);
  if ("doubleValue" in v) return v.doubleValue;
  if ("booleanValue" in v) return v.booleanValue;
  if ("bytesValue" in v) return v.bytesValue;     // base64
  return null;
}
function fromDoc(doc) {
  const o = { _id: doc.name.split("/").pop() };
  for (const k in (doc.fields || {})) o[k] = val(doc.fields[k]);
  return o;
}
function toFields(obj) {
  const f = {};
  for (const k in obj) {
    if (k.startsWith("_")) continue;
    const v = obj[k];
    if (v === null || v === undefined) f[k] = { nullValue: null };
    else if (typeof v === "string") f[k] = k === "strokes" ? { bytesValue: v } : { stringValue: v };
    else if (typeof v === "boolean") f[k] = { booleanValue: v };
    else if (typeof v === "number") f[k] = Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };
  }
  return f;
}

const cloud = {
  async call(url, opts) {
    await refreshIfNeeded();
    const o = Object.assign({}, opts); o.headers = Object.assign({ Authorization: "Bearer " + session.idToken }, o.headers || {});
    const r = await fetch(url, o);
    const j = await r.json().catch(() => ({}));
    if (!r.ok) {
      const m = (j.error && j.error.message) || r.statusText;
      if (r.status === 403) throw new Error("Access denied: check the Firestore rules are published. " + m);
      throw new Error(m);
    }
    return j;
  },
  async list(col) {
    const out = []; let token = "";
    do {
      const j = await this.call(`${FS}/users/${session.uid}/${col}?pageSize=300${token ? "&pageToken=" + encodeURIComponent(token) : ""}`);
      (j.documents || []).forEach(d => out.push(fromDoc(d)));
      token = j.nextPageToken || "";
    } while (token);
    return out;
  },
  async pagesOf(nbId) {
    const j = await this.call(`${FS}/users/${session.uid}:runQuery`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ structuredQuery: { from: [{ collectionId: "pages" }],
        where: { fieldFilter: { field: { fieldPath: "notebookId" }, op: "EQUAL", value: { stringValue: nbId } } } } }),
    });
    return j.filter(x => x.document).map(x => fromDoc(x.document));
  },
  async get(col, id) {
    try { return fromDoc(await this.call(`${FS}/users/${session.uid}/${col}/${encodeURIComponent(id)}`)); } catch (e) { return null; }
  },
  async put(col, id, obj) {
    await this.call(`${FS}/users/${session.uid}/${col}/${encodeURIComponent(id)}`, {
      method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ fields: toFields(obj) }),
    });
  },
  async del(col, id) {
    await this.call(`${FS}/users/${session.uid}/${col}/${encodeURIComponent(id)}`, { method: "DELETE" });
  },
};

const demoStore = { folders: {}, notebooks: {}, pages: {}, documents: {}, deleted: {} };
const mem = {
  async list(col) { return Object.keys(demoStore[col]).map(id => Object.assign({ _id: id }, demoStore[col][id])); },
  async pagesOf(nbId) { return Object.keys(demoStore.pages).filter(id => demoStore.pages[id].notebookId === nbId).map(id => Object.assign({ _id: id }, demoStore.pages[id])); },
  async get(col, id) { const d = demoStore[col][id]; return d ? Object.assign({ _id: id }, d) : null; },
  async put(col, id, obj) { const c = {}; for (const k in obj) if (!k.startsWith("_")) c[k] = obj[k]; demoStore[col][id] = c; },
  async del(col, id) { delete demoStore[col][id]; },
};
let backend = cloud;

// ------------------------------------------------------------------ ink: the app's binary stroke format (big-endian)
const TOOLS = ["PEN", "MARKER", "ERASER", "TEXT"];
function b64ToBytes(b64) { const bin = atob(b64), u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i); return u8; }
function bytesToB64(u8) { let s = ""; for (let i = 0; i < u8.length; i += 8192) s += String.fromCharCode.apply(null, u8.subarray(i, i + 8192)); return btoa(s); }
function decodeStrokes(b64) {
  if (!b64) return [];
  try {
    const u8 = b64ToBytes(b64), dv = new DataView(u8.buffer); let p = 0;
    if (dv.getUint8(p++) !== 1) return [];
    const count = dv.getInt32(p); p += 4;
    const out = [];
    for (let s = 0; s < count; s++) {
      const tool = TOOLS[dv.getUint8(p++)]; const color = dv.getInt32(p); p += 4;
      const width = dv.getFloat32(p); p += 4; const m = dv.getInt32(p); p += 4;
      const pts = new Float32Array(m * 4);
      for (let i = 0; i < m * 4; i++) { pts[i] = dv.getFloat32(p); p += 4; }
      out.push({ tool, color, width, n: m, pts });
    }
    return out;
  } catch (e) { return []; }
}
function encodeStrokes(strokes) {
  let size = 5; strokes.forEach(s => size += 13 + s.n * 16);
  const dv = new DataView(new ArrayBuffer(size)); let p = 0;
  dv.setUint8(p++, 1); dv.setInt32(p, strokes.length); p += 4;
  strokes.forEach(s => {
    dv.setUint8(p++, Math.max(0, TOOLS.indexOf(s.tool))); dv.setInt32(p, s.color | 0); p += 4;
    dv.setFloat32(p, s.width); p += 4; dv.setInt32(p, s.n); p += 4;
    for (let i = 0; i < s.n * 4; i++) { dv.setFloat32(p, s.pts[i]); p += 4; }
  });
  return bytesToB64(new Uint8Array(dv.buffer));
}
function argb(c, alpha) {
  c = c >>> 0;
  const a = ((c >>> 24) & 255) / 255, r = (c >>> 16) & 255, g = (c >>> 8) & 255, b = c & 255;
  return `rgba(${r},${g},${b},${alpha != null ? alpha : a})`;
}
function pressureFactor(p) { const q = p <= 0 ? 0.5 : Math.min(1, Math.max(0, p)); return 0.5 + q * 0.9; }

function drawStroke(ctx, s) {
  if (s.tool !== "PEN" && s.tool !== "MARKER") return;
  const n = s.n, P = s.pts; if (!n) return;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  if (s.tool === "MARKER") {
    ctx.strokeStyle = argb(s.color, 0.4); ctx.lineWidth = s.width;
    ctx.beginPath(); ctx.moveTo(P[0], P[1]); if (n === 1) ctx.lineTo(P[0] + 0.01, P[1]);
    for (let i = 1; i < n; i++) ctx.lineTo(P[i * 4], P[i * 4 + 1]);
    ctx.stroke(); return;
  }
  ctx.strokeStyle = argb(s.color, 1); ctx.fillStyle = ctx.strokeStyle;
  if (n === 1) { ctx.beginPath(); ctx.arc(P[0], P[1], s.width * pressureFactor(P[2]) / 2, 0, 7); ctx.fill(); return; }
  for (let i = 1; i < n; i++) {
    ctx.lineWidth = s.width * pressureFactor((P[(i - 1) * 4 + 2] + P[i * 4 + 2]) / 2);
    ctx.beginPath(); ctx.moveTo(P[(i - 1) * 4], P[(i - 1) * 4 + 1]); ctx.lineTo(P[i * 4], P[i * 4 + 1]); ctx.stroke();
  }
}
/** Does the eraser circle (x, y, r) touch this stroke? Same idea as the app: any segment close enough removes the whole stroke. */
function strokeHit(s, x, y, r) {
  const P = s.pts, reach = r + s.width / 2;
  for (let i = 0; i < s.n; i++) {
    const ax = P[i * 4], ay = P[i * 4 + 1];
    if (i === s.n - 1 || s.n === 1) { if (Math.hypot(ax - x, ay - y) <= reach) return true; continue; }
    const bx = P[(i + 1) * 4], by = P[(i + 1) * 4 + 1], dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
    let t = l2 ? ((x - ax) * dx + (y - ay) * dy) / l2 : 0; t = Math.max(0, Math.min(1, t));
    if (Math.hypot(ax + t * dx - x, ay + t * dy - y) <= reach) return true;
  }
  return false;
}

// ------------------------------------------------------------------ paper
function drawPaper(ctx, style) {
  if (!style || style === "BLANK") return;
  ctx.strokeStyle = "#C7D3E6"; ctx.lineWidth = 0.6;
  if (style === "RULED") { for (let y = 48; y < PH; y += 24) line(ctx, 0, y, PW, y); }
  else if (style === "GRID") { for (let y = 21.5; y < PH; y += 21.5) line(ctx, 0, y, PW, y); for (let x = 21.5; x < PW; x += 21.5) line(ctx, x, 0, x, PH); }
  else if (style === "DOT") { ctx.fillStyle = "#C7D3E6"; for (let y = 21.5; y < PH; y += 21.5) for (let x = 21.5; x < PW; x += 21.5) { ctx.beginPath(); ctx.arc(x, y, 0.8, 0, 7); ctx.fill(); } }
}
function line(ctx, x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }

// ------------------------------------------------------------------ rich text layout (an approximation of the app's layout)
const FAMILY = { sans: 'Roboto, system-ui, "Segoe UI", sans-serif', serif: 'Georgia, "Times New Roman", serif', mono: 'ui-monospace, Consolas, monospace' };
const INDENT = 24, LIST_MARGIN = 20, BREAK = "​";
let measureCtx = document.createElement("canvas").getContext("2d");

function fontOf(r) { return `${r.italic ? "italic " : ""}${r.bold ? "bold " : ""}${r.size || 14}px ${FAMILY[r.font] || FAMILY.sans}`; }
function parseContent(json) {
  try {
    const o = JSON.parse(json);
    return { spacing: o.spacing || 1.2, paras: (o.paragraphs && o.paragraphs.length ? o.paragraphs : [{ runs: [] }]) };
  } catch (e) { return { spacing: 1.2, paras: [{ runs: [] }] }; }
}
function contentJson(paras, spacing) { return JSON.stringify({ spacing, paragraphs: paras }); }

function layout(paras, spacing, width) {
  const lines = []; let y = 0; const nums = {};
  paras.forEach(p => {
    const runs = (p.runs || []);
    const text = runs.map(r => r.text || "").join("");
    const indent = (p.indent || 0) * INDENT + (p.list && p.list !== "none" ? LIST_MARGIN : 0);
    const avail = Math.max(20, width - indent);
    let label = "";
    if (p.list === "bullet") label = "•";
    else if (p.list === "number") { const k = "i" + (p.indent || 0); nums[k] = (nums[k] || 0) + 1; label = nums[k] + "."; }
    else { for (const k in nums) delete nums[k]; }

$("prev").onclick = async () => { await waitSaved(); go(-1); }; $("next").onclick = async () => { await waitSaved(); go(1); };
document.addEventListener("keydown", e => {
  if (e.target && (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT" || e.target.tagName === "SELECT")) return;
  if (e.key === "ArrowLeft") go(-1); if (e.key === "ArrowRight") go(1);
  if (edit && (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  if (edit && (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "y") { e.preventDefault(); redo(); }
});
window.addEventListener("resize", () => { if (current && pages.length && !editingBoxId && !live) showPage(); });
$("menuBtn").onclick = () => $("side").classList.toggle("open");
$("refreshBtn").onclick = async () => { await waitSaved(); loadLibrary(); };
$("editBtn").onclick = async () => { edit = !edit; closeBoxEditor(true); selectedBox = null; await waitSaved(); showPage(); };
document.querySelectorAll("[data-tool]").forEach(b => b.onclick = () => { tool = b.dataset.tool; closeBoxEditor(true); selectedBox = null; if (cv) cv.style.cursor = tool === "text" ? "text" : tool === "eraser" ? "cell" : "crosshair"; refreshTools(); });
document.querySelectorAll("[data-col]").forEach(b => b.onclick = () => { colIdx = +b.dataset.col; if (tool === "eraser" || tool === "text") tool = "pen"; refreshTools(); });
document.querySelectorAll("[data-wd]").forEach(b => b.onclick = () => { wdIdx = +b.dataset.wd; refreshTools(); });
$("undo").onclick = undo; $("redo").onclick = redo; $("delBox").onclick = deleteSelectedBox;
$("addPage").onclick = async () => {
  try { await addPageAfter(idx); idx = idx + 1; showPage(); } catch (e) { setStatus("Could not add the page: " + e.message, true); }
};
$("delPage").onclick = async () => {
  if (!pages.length || !confirm("Delete this page? This also removes it from your other devices.")) return;
  try { await deletePageAt(idx); idx = Math.min(idx, pages.length - 1); showPage(); } catch (e) { setStatus("Could not delete the page: " + e.message, true); }
};
$("delNb").onclick = async () => {
  if (!current || !confirm(`Delete the notebook "${current.title}" and all its pages? This also removes it from your other devices.`)) return;
  try { await waitSaved(); const nb = current; current = null; pages = []; await deleteNotebookCascade(nb); await loadLibrary(); $("bar").classList.add("hidden"); $("tools").classList.add("hidden"); $("stage").innerHTML = '<div id="empty">Choose a notebook on the left.</div>'; }
  catch (e) { setStatus("Could not delete the notebook: " + e.message, true); }
};
$("png").onclick = () => {
  if (!pages.length) return;
  const c2 = document.createElement("canvas"); c2.width = PW * 3; c2.height = PH * 3;
  renderPage(c2.getContext("2d"), current, curPage(), 3);
  c2.toBlob(b => { const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = `${(current.title || "page").replace(/[^\w\- ]+/g, "_")}-${idx + 1}.png`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); });
};
$("signOutBtn").onclick = async () => { await waitSaved(); session = null; demo = false; backend = cloud; forget(); current = null; pages = []; edit = false; $("password").value = ""; showLogin(""); };
$("nbCancel").onclick = () => $("nbDialog").close();
$("nbForm").onsubmit = async e => {
  e.preventDefault(); $("nbDialog").close();
  try { const nb = await createNotebook($("nbName").value, $("nbPaper").value, +$("nbCover").value); await loadLibrary(); const n = notebooks.find(x => x._id === nb._id); if (n) openNotebook(n, 0); }
  catch (err) { setStatus("Could not create the notebook: " + err.message, true); }
};
$("loginForm").onsubmit = async e => {
  e.preventDefault(); $("loginErr").textContent = ""; $("signInBtn").disabled = true;
  try {
    const j = await authCall("signInWithPassword", { email: $("email").value.trim(), password: $("password").value, returnSecureToken: true });
    demo = false; backend = cloud; setSession(j); remember(); await enterApp();
  } catch (err) { $("loginErr").textContent = err.message; }
  $("signInBtn").disabled = false;
};
$("resetBtn").onclick = async () => {
  const email = $("email").value.trim(); if (!email) { $("loginErr").textContent = "Enter your email first."; return; }
  try { await authCall("sendOobCode", { requestType: "PASSWORD_RESET", email }); $("loginErr").textContent = "Password reset email sent. Check your inbox."; }
  catch (err) { $("loginErr").textContent = err.message; }
};

// ------------------------------------------------------------------ demo mode (sample data, kept in memory only)
function seedDemo() {
  const now = Date.now();
  const spiral = { tool: "PEN", color: INK_COLORS[1], width: 3, n: 0, pts: [] };
  for (let i = 0; i < 90; i++) { const a = i / 8, r = 6 + i * 1.4; spiral.pts.push(420 + Math.cos(a) * r, 520 + Math.sin(a) * r, 0.5 + 0.4 * Math.sin(i / 9), i * 12); spiral.n++; }
  spiral.pts = Float32Array.from(spiral.pts);
  const under = { tool: "MARKER", color: INK_COLORS[2], width: 14, n: 2, pts: Float32Array.from([70, 138, 0.5, 0, 330, 138, 0.5, 200]) };
  const box = { id: uuid(), x: 60, y: 90, w: 300, h: 80, z: 0, updatedAt: now,
    content: contentJson([
      { style: "heading", align: "left", list: "none", indent: 0, runs: [{ text: "Meeting notes", size: 22, bold: true }] },
      { style: "body", align: "left", list: "bullet", indent: 0, runs: [{ text: "Sync works between the tablet and here", size: 14 }] },
      { style: "body", align: "left", list: "bullet", indent: 0, runs: [{ text: "Draw with the pen, ", size: 14 }, { text: "type with the text tool", size: 14, italic: true }] },
    ], 1.2) };
  demoStore.notebooks["demo-nb1"] = { folderId: null, title: "Demo: Grid notes", cover: 1, paperStyle: "GRID", createdAt: now, updatedAt: now, lastOpenedAt: now };
  demoStore.pages["demo-p1"] = { notebookId: "demo-nb1", index: 0, type: "INK", documentId: null, pdfPage: -1, updatedAt: now, boxes: JSON.stringify([box]), strokes: encodeStrokes([spiral, under]) };
  demoStore.pages["demo-p2"] = { notebookId: "demo-nb1", index: 1, type: "INK", documentId: null, pdfPage: -1, updatedAt: now, boxes: "[]", strokes: encodeStrokes([]) };
  demoStore.notebooks["demo-nb2"] = { folderId: null, title: "Demo: Typed pages", cover: 3, paperStyle: "BLANK", createdAt: now - 5, updatedAt: now - 5, lastOpenedAt: now - 5 };
  demoStore.documents["demo-d1"] = { notebookId: "demo-nb2", updatedAt: now, content: contentJson([
    { style: "title", align: "left", list: "none", indent: 0, runs: [{ text: "A typed page", size: 26, bold: true }] },
    { style: "body", align: "left", list: "none", indent: 0, runs: [{ text: "Typed pages flow like a document and are edited in the SNote app. This viewer shows them as they are on the tablet, and you can draw over them.", size: 14 }] },
  ], 1.2) };
  demoStore.pages["demo-p3"] = { notebookId: "demo-nb2", index: 0, type: "TYPED", documentId: "demo-d1", pdfPage: -1, updatedAt: now, boxes: "[]", strokes: encodeStrokes([]) };
}
$("demoBtn").onclick = async () => {
  demo = true; backend = mem; session = { email: "demo (nothing is saved)", uid: "demo" };
  Object.keys(demoStore).forEach(k => demoStore[k] = {}); seedDemo(); await enterApp();
};

// stay signed in: swap the saved refresh token for a fresh session
(async () => {
  if (location.hash === "#demo") { $("demoBtn").onclick(); return; }
  try {
    const saved = JSON.parse(localStorage.getItem("snote_session") || "null");
    if (saved && saved.r) {
      session = { refreshToken: saved.r, email: saved.e, expires: 0 };
      await refreshIfNeeded(); session.email = saved.e;
      await enterApp(); return;
    }
  } catch (e) { session = null; forget(); }
  showLogin("");
})();
// pick up changes made on the tablet when coming back to this tab (never while there are unsaved edits)
document.addEventListener("visibilitychange", () => { if (!document.hidden && session && !demo && !dirty.size && !live && !editingBoxId) loadLibrary(); });
</script>
